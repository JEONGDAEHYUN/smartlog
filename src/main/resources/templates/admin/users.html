<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - SmartLog 관리자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<nav th:replace="~{fragments/topbar :: topbar}"></nav>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('admin-users')}"></div>

    <div class="flex-grow-1" style="min-height: calc(100vh - 42px); background: #f4f6f8;">
        <div class="bg-white border-bottom px-4 py-2 small text-muted">
            <span>홈</span> <span class="mx-1">▶</span>
            <span class="fw-bold" style="color:var(--n6);">회원 관리</span>
        </div>

        <div class="p-4">

            <!-- 헤더 -->
            <div class="d-flex align-items-center gap-2 mb-3">
                <div class="sec-bar"></div>
                <span class="fw-bold small">전체 회원 목록</span>
                <span class="badge bg-secondary ms-1" th:text="${users.size() + '명'}"></span>
            </div>

            <!-- 알림 메시지 -->
            <div th:if="${error}" class="alert alert-danger small py-2 mb-3" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success small py-2 mb-3" th:text="${success}"></div>

            <!-- 회원 테이블 -->
            <div class="card border">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 small">
                            <thead style="background:#f8fafc;">
                                <tr>
                                    <th class="px-3 py-2">이름</th>
                                    <th class="px-3 py-2">이메일</th>
                                    <th class="px-3 py-2">조직명</th>
                                    <th class="px-3 py-2">권한</th>
                                    <th class="px-3 py-2">계정 상태</th>
                                    <th class="px-3 py-2">가입일</th>
                                    <th class="px-3 py-2 text-center">관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${users}">
                                    <td class="px-3 py-2 fw-semibold" th:text="${u.userName}"></td>
                                    <td class="px-3 py-2 text-muted" th:text="${u.userEmail}"></td>
                                    <td class="px-3 py-2" th:text="${u.orgName}"></td>

                                    <!-- 권한 배지 -->
                                    <td class="px-3 py-2">
                                        <span th:if="${u.userRole == 'ROLE_ADMIN'}"
                                              class="badge" style="background:#7c3aed; color:#fff;">ADMIN</span>
                                        <span th:if="${u.userRole == 'ROLE_USER'}"
                                              class="badge bg-secondary-subtle text-secondary">USER</span>
                                    </td>

                                    <!-- 계정 상태 배지 -->
                                    <td class="px-3 py-2">
                                        <span th:if="${u.isLocked()}"
                                              class="badge bg-danger-subtle text-danger">잠금</span>
                                        <span th:if="${!u.isLocked()}"
                                              class="badge bg-success-subtle text-success">정상</span>
                                    </td>

                                    <td class="px-3 py-2 text-muted"
                                        th:text="${#temporals.format(u.regDt, 'yyyy-MM-dd')}"></td>

                                    <!-- 관리 버튼 -->
                                    <td class="px-3 py-2 text-center">
                                        <div class="d-flex gap-1 justify-content-center">

                                            <!-- 잠금/해제 버튼 -->
                                            <form th:action="@{/admin/users/{id}/lock(id=${u.userId})}" method="post">
                                                <button type="submit" class="btn btn-sm fw-semibold"
                                                        th:classappend="${u.isLocked()} ? 'btn-outline-success' : 'btn-outline-danger'"
                                                        th:text="${u.isLocked()} ? '잠금 해제' : '계정 잠금'"
                                                        th:onclick="${u.isLocked()} ? 'return confirm(u.userName + \'의 잠금을 해제하시겠습니까?\')' : 'return confirm(\'' + u.userName + '의 계정을 잠금하시겠습니까?\')'">
                                                </button>
                                            </form>

                                            <!-- 권한 변경 버튼 -->
                                            <form th:action="@{/admin/users/{id}/role(id=${u.userId})}" method="post">
                                                <button type="submit" class="btn btn-sm fw-semibold"
                                                        th:classappend="${u.userRole == 'ROLE_ADMIN'} ? 'btn-outline-secondary' : 'btn-outline-primary'"
                                                        th:text="${u.userRole == 'ROLE_ADMIN'} ? '→ USER' : '→ ADMIN'"
                                                        th:onclick="'return confirm(\'' + u.userName + '의 권한을 변경하시겠습니까?\')'">
                                                </button>
                                            </form>

                                        </div>
                                    </td>
                                </tr>

                                <!-- 회원 없을 때 -->
                                <tr th:if="${users.isEmpty()}">
                                    <td colspan="7" class="text-center text-muted py-4">등록된 회원이 없습니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 안내 -->
            <div class="mt-3 small text-muted">
                <span class="text-danger fw-semibold">※</span> 자신의 계정은 잠금·권한 변경이 불가합니다.
                계정 잠금 시 365일간 로그인이 차단됩니다.
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
